version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '04:00'
          timezone: Asia/Tokyo
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns:
                  - '*'

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '04:30'
          timezone: Asia/Tokyo
      open-pull-requests-limit: 10
      groups:
          npm-development-minor-and-patch:
              dependency-type: development
              update-types:
                  - minor
                  - patch
          npm-production-minor-and-patch:
              dependency-type: production
              update-types:
                  - minor
                  - patch

    - package-ecosystem: npm
      directory: /examples/next-client-only
      schedule:
          interval: weekly
          day: monday
          time: '05:00'
          timezone: Asia/Tokyo
      open-pull-requests-limit: 5
      groups:
          next-example-minor-and-patch:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
